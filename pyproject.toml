[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlab"
version = "0.1.0"
description = "Alpaca tabanli, gozetimsiz calisan ve kendi islemlerinden ogrenen trading sistemi"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=4.0",
]

[project.scripts]
tlab = "tlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tlab = ["journal/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# S = bandit guvenlik kurallari. Para hareketi yapan bir sistemde
# acik edilmis sir, dogrulanmamis SQL ve benzeri tuzaklar pahaliya
# mal olur; linter bunlari ucuz yakaliyor.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Testlerde assert kullanmak zaten isin dogasi (S101); kullanilmayan
# fixture argumanlari pytest deseninin parcasi (ARG001); sahte
# nesneler ise protokol imzasina uymak zorunda oldugu icin
# kullanmadiklari parametreleri de tasir (ARG002).
# S311: testlerde sentetik fiyat serisi uretmek icin random
# kullaniliyor; kriptografik bir amac yok ve tohum sabit
# (tekrarlanabilirlik icin sart).
# S607: mimari testleri `git` komutunu PATH uzerinden cagiriyor;
# tam yol makineye gore degisir ve testin tasinabilirligini bozar.
"tests/*" = ["ARG001", "ARG002", "S101", "S311", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Uyarilar hata sayiliyor: kendi kodumuzda olusan bir DeprecationWarning
# sessizce birikip bir gun calismayi durdurmasin. Ucuncu taraf
# kutuphanelerin kendi uyarilari muaf - onlari duzeltmek bizim elimizde
# degil ve CI'yi bizimle ilgisiz sebeplerle kirarlar.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:alpaca.*",
]

markers = [
    "network: ag erisimi gerektiren testler (varsayilan olarak calistirilmaz)",
]

[tool.mypy]
python_version = "3.12"
# Testler de denetleniyor. Sebebi sadece titizlik degil: sahte
# broker ve veri kaynagi, protokollere yapisal olarak uyduklari icin
# calisiyor. Protokol degisip de sahteler geride kalirsa bunu
# calisma aninda degil, tip denetiminde gormek istiyoruz.
files = ["src/tlab", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["alpaca.*", "pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tlab"]
branch = true

[tool.coverage.report]
# Esik mevcut seviyenin biraz altinda: amac orani yukseltmek degil,
# gerilemeyi yakalamak. Testsiz eklenen buyuk bir modul burada goze
# carpar.
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
