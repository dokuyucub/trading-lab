[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlab"
version = "0.1.0"
description = "Alpaca tabanli, gozetimsiz calisan ve kendi islemlerinden ogrenen trading sistemi"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.42",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
tlab = "tlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tlab = ["journal/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# S = bandit guvenlik kurallari. Para hareketi yapan bir sistemde
# acik edilmis sir, dogrulanmamis SQL ve benzeri tuzaklar pahaliya
# mal olur; linter bunlari ucuz yakaliyor.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Testlerde assert kullanmak zaten isin dogasi (S101); kullanilmayan
# fixture argumanlari pytest deseninin parcasi (ARG001); sahte
# nesneler ise protokol imzasina uymak zorunda oldugu icin
# kullanmadiklari parametreleri de tasir (ARG002).
"tests/*" = ["ARG001", "ARG002", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: ag erisimi gerektiren testler (varsayilan olarak calistirilmaz)",
]

[tool.mypy]
python_version = "3.12"
packages = ["tlab"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["alpaca.*", "pandas.*", "pyarrow.*"]
ignore_missing_imports = true
