# ORB baseline olcumu icin veri kumesi.
#
# BU DOSYA SONUC GORULMEDEN SABITLENDI (2026-09-26). Tarihler ve
# semboller calistirma aninda secilmez; degistirmek yeni bir
# dataset_id gerektirir ve sebebi yalnizca VERI KALITESI olabilir,
# performans asla (AGENTS §3).
#
# Aralik: 2026-06-22 - 2026-09-18, yaklasik 63 islem seansi.
# Son %20 tamamlanmis seans holdout'a ayrilir ve ilk olcumde ACILMAZ.
#
# ONCEKI KIMLIK: orb-baseline-2026q3 (12 sembol, hic indirilmedi ve
# hic olculmedi). Tek fark: JPM cikarildi (Codex karari, #17). Gerekce
# YALNIZCA veri kalitesi: iki pilotta (IEX, ayni politika) JPM 24
# seansin 8'inde uygunsuz, bunlarin 6'sinda acilis penceresi eksik;
# diger 11 sembolde 24 seansta uygunsuz seans gozlenmedi. Karar P&L
# hesaplanmadan ve ana indirme yapilmadan verildi. Bu, JPM veya IEX
# hakkinda genel bir hukum DEGIL; yalnizca bu olcumun ORB acilis
# araligini bu sembolde guvenilir kuramayacagi anlamina gelir.
# Diger butun alanlar onceki tanimla ayni (test denetler).
dataset_id: orb-baseline-2026q3-u11
# approved (#17, karar kaydi AGENTS §11): iki kalite pilotundan, JPM'nin
# veri kalitesi gerekcesiyle cikarilmasindan ve #32/#33 incelemelerinden
# sonra AYRI bir commit ile. Onay YALNIZCA bu sabit tanimin indirilip
# baseline bolumunun bir kez olculmesine yoneliktir; islem, emir, canli
# dagitim, holdout'un acilmasi ya da parametre terfisi DEGILDIR.
status: approved
symbols: [SPY, QQQ, IWM, AAPL, MSFT, NVDA, AMD, AMZN, GOOGL, META, TSLA]
timeframe: 1Min
feed: iex
adjustment: raw
start: 2026-06-22
end: 2026-09-18
exchange_timezone: America/New_York
holdout_fraction: 0.20
split_unit: session
settle_minutes: 20
retention_days: 90
# Kalite politikasi (Codex B2). Bolme yalnizca takvime bakar; bu
# esikler bir seansin OLCULEBILIR olup olmadigini soyler. Uygun olmayan
# seans varsa olcum P&L uretmeden durur.
#
# Asagidaki degerler onayla KESINLESTI; iki pilotta bu degerlerle olculdu
# ve gevsetilmedi. Indirmeden sonra degistirmek yeni dataset_id demektir;
# ayni donemi gecsin diye degistirmek yasak (AGENTS §3, §11).
#   open_window_minutes >= ORB acilis araligi (15 dk)  - olcum denetler
#   close_window_minutes <= gun sonu tamponu (10 dk)  - olcum denetler
#
# Acilis penceresinde eksik dakika 0: tek bir eksik dakika acilis
# araliginin tepe/dibini bozabilir ve veri yoklugu "islem olmadi" diye
# varsayilamaz (Codex, #19). IEX bunu saglayamiyorsa esik sirf olcum
# gecsin diye gevsetilmez; sinirlama pilotta olculup acikca tartisilir.
quality:
  open_window_minutes: 15
  max_missing_open_window: 0
  close_window_minutes: 10
  max_missing_fraction: 0.10
  max_ineligible_sessions: 0
