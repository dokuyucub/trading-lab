# ORB baseline olcumu icin veri kumesi.
#
# BU DOSYA SONUC GORULMEDEN SABITLENDI (2026-09-26). Tarihler ve
# semboller calistirma aninda secilmez; degistirmek yeni bir
# dataset_id gerektirir ve sebebi yalnizca VERI KALITESI olabilir,
# performans asla (AGENTS §3).
#
# Aralik: 2026-06-22 - 2026-09-18, yaklasik 63 islem seansi.
# Son %20 tamamlanmis seans holdout'a ayrilir ve ilk olcumde ACILMAZ.
dataset_id: orb-baseline-2026q3
symbols: [SPY, QQQ, IWM, AAPL, MSFT, NVDA, AMD, AMZN, GOOGL, META, TSLA, JPM]
timeframe: 1Min
feed: iex
adjustment: raw
start: 2026-06-22
end: 2026-09-18
exchange_timezone: America/New_York
holdout_fraction: 0.20
split_unit: session
settle_minutes: 20
retention_days: 90
# Kalite politikasi (Codex B2). Bolme yalnizca takvime bakar; bu
# esikler bir seansin OLCULEBILIR olup olmadigini soyler. Uygun olmayan
# seans varsa olcum P&L uretmeden durur.
#
# DIKKAT - HENUZ KESIN DEGIL: asagidaki degerler oneridir. Pilotun
# kalite olcumunden sonra ve bu kume INDIRILMEDEN ONCE Codex ile
# birlikte kesinlesir. Indirmeden sonra degistirmek yeni dataset_id.
#   open_window_minutes >= ORB acilis araligi (15 dk)  - olcum denetler
#   close_window_minutes <= gun sonu tamponu (10 dk)  - olcum denetler
quality:
  open_window_minutes: 15
  max_missing_open_window: 3
  close_window_minutes: 10
  max_missing_fraction: 0.10
  max_ineligible_sessions: 0
