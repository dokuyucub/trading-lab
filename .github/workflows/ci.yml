name: CI

# Her push ve her PR'da calisir. Amaci tek: "eskiden calisiyordu, artik
# calismiyor" durumunun main'e hic ulasmamasi. Kirilma an olarak,
# kiran commit belliyken yakalanir.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Tek surum, Docker imajiyla ayni: uretimde calisacak olan
          # neyse CI'da denetlenen de o. Iki surum desteklemek, ikisinin
          # bagimlilik cozumlemesi ayristiginda CI'yi kodla ilgisi
          # olmayan sebeplerle kirar.
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklari kur
        run: pip install -e ".[dev]"

      - name: Linter
        run: ruff check --output-format=github .

      - name: Bicim denetimi
        run: ruff format --check .

      - name: Tip denetimi
        run: mypy

      - name: Testler
        run: pytest -q
