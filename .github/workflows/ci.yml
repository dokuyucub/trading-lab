name: CI

# Her push ve her PR'da calisir. Amaci tek: "eskiden calisiyordu, artik
# calismiyor" durumunun main'e hic ulasmamasi. Kirilma an olarak,
# kiran commit belliyken yakalanir.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bagimliliklari kur
        run: pip install -e ".[dev]"

      - name: Linter
        run: ruff check --output-format=github .

      - name: Bicim denetimi
        run: ruff format --check .

      - name: Tip denetimi
        run: mypy --strict src/tlab

      - name: Testler
        run: pytest -q
