name: CI

# Amac tek: "eskiden calisiyordu, artik calismiyor" durumunun main'e
# hic ulasmamasi. Kirilma, kiran commit belliyken yakalanmali.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Haftalik "kanarya" kosusu: bagimliliklar SABITLENMEDEN kurulur.
    # Boylece ust akistaki bir kirilma, rastgele bir PR'i kirmadan
    # once bizim sectigimiz bir anda ortaya cikar.
    - cron: "0 6 * * 1"

# Ayni dala arka arkaya push gelirse eski kosu iptal edilir:
# bekleyen kuyruk, geri bildirimi geciktirmenin en sik sebebi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Tek surum, Docker imajiyla ayni: uretimde calisacak olan
          # neyse CI'da denetlenen de o.
          python-version: "3.12"
          cache: pip

      - name: Probe startup with runtime dependencies only
        run: |
          python -m pip install -r requirements.lock
          PYTHONPATH=src python -m unittest discover -s tests -p test_paper_probe_startup.py

      - name: Kilitli bagimliliklari kur
        # requirements-dev.lock tam surumleri sabitliyor. Sabitlenmemis
        # bir kurulum, ayni commit'in iki hafta arayla farkli paket
        # surumleriyle kurulmasi demek - CI bir gun kodla ilgisi
        # olmayan bir sebeple kirilir.
        #
        # --no-deps bilincli: bagimliliklar kilitten geliyor, paketin
        # kendi cozumlemesi devreye girip kilidi delmemeli.
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Bagimlilik tutarliligi
        # --no-deps kurulum cozumleme yapmadigi icin, kilidin kendi
        # icinde tutarli oldugunu ayrica dogruluyoruz.
        run: pip check

      - name: Linter
        run: ruff check --output-format=github .

      - name: Bicim denetimi
        run: ruff format --check .

      - name: Tip denetimi
        run: mypy

      - name: Testler
        run: pytest --cov=tlab --cov-report=term-missing:skip-covered

  canary:
    name: canary (guncel bagimliliklar)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Guncel bagimliliklari kur (kilitsiz)
        run: pip install -e ".[dev]"

      - name: Linter
        run: ruff check .

      - name: Tip denetimi
        # Bu adim bilincli: kanaryayi dogduran kirilma tam olarak bir
        # TIP DENETIMI kirilmasiydi (numpy stub'lari). Yalnizca pytest
        # calistiran bir kanarya, kendi varlik sebebini kaciririrdi.
        run: mypy

      - name: Testler
        run: pytest -q

      - name: Kurulu surumler
        if: always()
        run: pip list --format=freeze
