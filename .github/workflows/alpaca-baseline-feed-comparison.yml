# Tarihsel SIP kalite karsilastirmasi (#17, AGENTS §11.3,
# docs/designs/baseline-feed-comparison.md).
# P&L YOK, emir YOK, holdout bari istenmez, TEK SEFERLIK bir olay.
#
# Gorev kodda sabit (feed_comparison.SIP_TASK): kaynak tanim hash'le
# kilitli, SIP override gorevde yazili, workflow girdi almaz. Ham barlar
# bellekte olculur ve diske YAZILMAZ. Disari cikan tek sey acik alan
# listeli ozet. Basarisizlikta yeniden kosu OTOMATIK degildir: once #17'ye
# kayit, sonra ayri karar. Sozlesme tests/test_architecture.py
# tarafindan denetlenir.
name: Alpaca baseline SIP feed comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    # Yalnizca main: baska bir dalda degistirilmis kod anahtarlara
    # erisemesin.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 11 sembol x 50 baseline seansi 1Min SIP indirme (sayfali) + bellekte
    # kalite olcumu (P&L yok). Olagan butce tahmini, mutlak ust sinir degil.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kilitli calisma zamani bagimliliklarini kur
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      # Secret'lar YALNIZCA bu adimda.
      - name: SIP kalitesini karsilastir
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: >-
          PYTHONPATH=src python -m tlab.feed_comparison
          --out "$RUNNER_TEMP/baseline-feed-comparison.json"
      # Yuklenen TEK dosya: karsilastirma ozeti. Kosulsuz adim yalnizca
      # onceki adimlar basariliysa calisir; erisim reddinde ozet yoktur ve
      # bu adim calismaz.
      - name: Karsilastirma ozetini yukle
        uses: actions/upload-artifact@v7
        with:
          name: baseline-feed-comparison
          path: ${{ runner.temp }}/baseline-feed-comparison.json
          if-no-files-found: error
          retention-days: 90
